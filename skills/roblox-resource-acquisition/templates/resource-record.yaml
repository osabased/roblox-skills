schema_version: 2

resource: ""
slug: "" # required for trusted records; stable curated/discovery identity
discovery_origin: "" # curated | project | devforum | other; explain direct user targeting under selection_reason

trust:
  level: untrusted # trusted | untrusted
  basis: "" # curated | verified-acquisition | project | explicit-user | other
  reason: ""

# Identity that the trust/verification record applies to. Trusted records require
# slug plus at least one of canonical_url/package_id; some trust bases are stricter.
canonical_url: ""
package_id: ""

verification:
  # Upstream resource proof only; generated-skill validation is tracked below.
  status: unverified # unverified | unavailable | verified | failed
  validated_at: "" # set YYYY-MM-DD when verification is attempted/established
  version_or_commit: ""

# Current project/resource state compared with the reviewed upstream state.
reconciliation:
  status: unknown # matched | mismatched | blocked | unknown | not-applicable
  checked_at: "" # YYYY-MM-DD when a reconciliation check ran
  installed_identity: ""
  installed_version_or_commit: ""
  detection_method: ""
  parent_state_sources: [] # matching v2 records/learnings actually consulted
  result: ""

capability: ""
devforum_url: "" # specific DevForum topic URL when applicable
selection_reason: ""
alternatives_considered: []

resource_proof:
  executed: false
  passed: false
  target_version_or_commit: "" # exact source/version actually exercised; required when executed
  environment: ""
  result: ""
  unavailable_claims: [] # material required claims that could not be executed; must be empty for verified-acquisition

# Optional second product. Leave generated_skill empty when no reusable child is in scope;
# its validation state never grants or revokes upstream resource trust by itself.
generated_skill: ""
skill_validation:
  structural_passed: false
  independent_behavioral_executed: false
  independent_behavioral_passed: false
  environment: ""
  result: ""
  catalog_routing_status: unverified # not-applicable | unverified | verified | unavailable | failed
  catalog_fingerprint: "" # sha256:<64 lowercase hex characters>
  catalog_environment: ""
  catalog_result: ""

# Empty means validated artifact only. Each entry uses:
# host, scope (repo | user | admin | plugin | other), location,
# status (installed | operational | blocked | disabled | removed | unavailable | failed),
# checked_at, result, and an evidence mapping with:
# installed (present | absent | not-applicable | unknown),
# registered (present | absent | not-applicable | unknown),
# discoverable ("yes" | "no" | unknown), enabled ("yes" | "no" | not-applicable | unknown),
# explicit_activation (passed | failed | not-run | unavailable).
host_adoptions: []

limitations: []
blocked_use_or_version: ""
rejection_reason: ""
reconsider_when: ""

