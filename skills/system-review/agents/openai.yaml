interface:
  display_name: "System Review"
  short_description: "Review cross-component system behavior and architecture"
  default_prompt: "Use $system-review to review the system through relevant end-to-end and failure scenarios. Distinguish demonstrated defects from visibility gaps and reconcile symptoms to root causes. When a defect has multiple materially different consequential corrections, return a direction handoff to $direction-selection instead of choosing inside the review."
